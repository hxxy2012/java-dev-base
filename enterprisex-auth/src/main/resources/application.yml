server:
  port: 9200

spring:
  application:
    name: enterprisex-auth

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/enterprisex?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: root
    type: com.alibaba.druid.pool.DruidDataSource

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

# JWT配置
jwt:
  secret: WW91ckJhc2U2NEVuY29kZWRTZWNyZXRLZXlNaW5pbXVtMjU2Qml0c0ZvckNTMjU2QWxnb3JpdGhtU2VjdXJpdHk=
  expiration: 7200
  refresh-expiration: 604800

# 服务地址配置
service:
  system:
    url: http://localhost:9201

# Knife4j配置
knife4j:
  enable: true

# 日志配置
logging:
  level:
    com.enterprisex: debug
